<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>MEC Workshop Timer</title>
<style>
:root{--bg:#08090b;--card:#121419;--line:#343840;--silver:#d7dae0;--muted:#90959e;--white:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b1e24,#08090b 45%);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:clamp(12px,3vw,30px)}.app{max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}h1{margin:4px 0 0;font-size:clamp(22px,3vw,36px)}.remain{text-align:right;color:var(--muted);font-size:12px}.remain b{display:block;color:var(--silver);font-size:18px}.layout{display:grid;grid-template-columns:1.65fr .75fr;gap:16px}.hero,.side{background:linear-gradient(145deg,#15171c,#0e1014);border:1px solid var(--line);border-radius:24px}.hero{min-height:570px;padding:clamp(20px,5vw,55px);display:flex;flex-direction:column;justify-content:center;text-align:center}.pill{align-self:center;border:1px solid #4b5059;border-radius:99px;padding:7px 13px;font-size:12px;color:var(--silver);font-weight:800;letter-spacing:.1em}.stage{font-size:clamp(26px,5vw,55px);font-weight:850;letter-spacing:-.04em;margin:18px 0 0}.clock{font-size:clamp(78px,16vw,180px);font-weight:850;line-height:.95;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:25px 0}.next{color:var(--muted)}.next b{color:var(--silver)}.track{height:8px;background:#292c32;border-radius:99px;overflow:hidden;margin:25px auto 0;width:min(760px,100%)}.fill{height:100%;background:linear-gradient(90deg,#7c818a,#f1f2f4);transition:width .2s linear}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:28px}button{min-height:46px;border:1px solid #41464f;background:#191c21;color:white;border-radius:12px;padding:0 17px;font-weight:750;cursor:pointer}.primary{background:var(--silver);color:#08090b;border-color:var(--silver);min-width:120px}.status{font-size:12px;color:var(--muted);margin-top:13px}.side{padding:17px}.side h2{font-size:16px;margin:3px 4px 12px}.list{display:grid;gap:6px}.row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 8px;border-radius:11px;color:var(--muted)}.row.now{background:#1d2026;color:white;border:1px solid #3c414a}.row.done{color:#696e77}.check{width:23px;height:23px;border:1px solid #51565f;border-radius:7px;display:grid;place-items:center;font-weight:900}.done .check{background:var(--silver);border-color:var(--silver);color:#08090b}.name{font-size:14px;font-weight:700}.dur{font-size:12px;font-variant-numeric:tabular-nums}.complete{display:none}.hero.finished .active{display:none}.hero.finished .complete{display:block}.bigcheck{font-size:80px}.complete h2{font-size:clamp(34px,6vw,70px);margin:8px}.complete p{color:var(--muted)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.hero{min-height:470px}.clock{font-size:clamp(75px,23vw,130px)}}@media(max-width:480px){body{padding:9px}.hero,.side{border-radius:18px}.hero{padding:24px 13px;min-height:430px}.head{padding:4px}.buttons button{flex:1 1 40%}.stage{font-size:28px}}
</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">Metropolitan Engineering Competition</div><h1>MEC Workshop Timer</h1></div><div class="remain">Workshop remaining<b id="total">2:00:00</b></div></header><div class="layout"><section class="hero" id="hero"><div class="active"><div class="pill" id="count">STAGE 1 OF 9</div><div class="stage" id="stage">Arrival / TMU Time</div><div class="clock" id="clock">10:00</div><div class="next">Next: <b id="next">Arduino + Soldering Intro — 15:00</b></div><div class="track"><div class="fill" id="fill"></div></div><div class="buttons"><button id="prev">← Previous</button><button class="primary" id="start">Start</button><button id="skip">Skip →</button><button id="reset">Reset</button></div><div class="status" id="status">Ready • press Start to enable sound</div></div><div class="complete"><div class="bigcheck">✓</div><h2>Workshop Complete</h2><p>Every scheduled stage is finished.</p><div class="buttons"><button class="primary" id="restart">Restart Workshop</button></div></div></section><aside class="side"><h2>Workshop Schedule</h2><div class="list" id="list"></div></aside></div></main>
<script>
const S=[["Arrival / TMU Time",600],["Arduino + Soldering Intro",900],["Rotation 1",1620],["Switch Stations",180],["Rotation 2",1620],["Switch Stations",180],["Rotation 3",1620],["Wrap Up / Return Equipment",180],["Exit Buffer",300]];
let i=0,left=S[0][1],run=false,tick=null,end=0,finished=false,w5=false,w1=false;
const $=x=>document.getElementById(x),fmt=s=>{s=Math.max(0,Math.ceil(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(z).padStart(2,"0")}`:`${m}:${String(z).padStart(2,"0")}`};
function total(){let t=left;for(let n=i+1;n<S.length;n++)t+=S[n][1];return t}
function sound(kind="ding"){try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),t=c.currentTime+.02;function tone(f,at,d=.25,v=.1){let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+d+.02)}if(kind==="ding"){tone(720,t,.28,.11);tone(960,t+.32,.35,.10)}else tone(600,t,.18,.05);setTimeout(()=>c.close(),1000)}catch(e){}}
function draw(){hero.classList.toggle("finished",finished);if(finished){$("total").textContent="0:00"}else{$("count").textContent=`STAGE ${i+1} OF ${S.length}`;$("stage").textContent=S[i][0];$("clock").textContent=fmt(left);$("total").textContent=fmt(total());$("next").textContent=i<S.length-1?`${S[i+1][0]} — ${fmt(S[i+1][1])}`:"Workshop Complete";$("fill").style.width=Math.max(0,Math.min(100,left/S[i][1]*100))+"%";$("start").textContent=run?"Pause":left<S[i][1]?"Resume":"Start";$("status").textContent=run?"Running • stages advance automatically":"Paused / ready"}$("list").innerHTML=S.map((s,n)=>`<div class="row ${n<i||finished?"done":n===i?"now":""}"><div class="check">${n<i||finished?"✓":""}</div><div class="name">${s[0]}</div><div class="dur">${fmt(s[1])}</div></div>`).join("")}
function stop(){if(tick)clearInterval(tick);tick=null}
function begin(){stop();end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,(end-Date.now())/1000);let q=Math.ceil(left);if(q===300&&!w5){w5=true;sound("soft")}if(q===60&&!w1){w1=true;sound("soft")}if(left<=0){advance(true);return}draw()},200)}
function advance(auto){if(auto)sound();if(i<S.length-1){i++;left=S[i][1];w5=w1=false;if(run)begin()}else{run=false;stop();left=0;finished=true;sound()}draw()}
function stage(n){finished=false;i=Math.max(0,Math.min(S.length-1,n));left=S[i][1];w5=w1=false;if(run)begin();draw()}
$("start").onclick=()=>{run=!run;if(run){sound();begin()}else stop();draw()};$("skip").onclick=()=>advance(false);$("prev").onclick=()=>stage(i-1);$("reset").onclick=()=>{run=false;stop();i=0;left=S[0][1];finished=false;w5=w1=false;draw()};$("restart").onclick=$("reset").onclick;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&run){left=Math.max(0,(end-Date.now())/1000);if(left<=0)advance(true);else draw()}});
draw();
</script></body></html>
